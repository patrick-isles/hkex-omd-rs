[package]
name = "hkex-omd-rs"
version = "0.1.0"
edition = "2021"
authors = ["Patrick Baillie Isles <isles12123@outlook.com>"]
description = "Zero-allocation, sub-microsecond HKEX Orion Market Data (OMD-C) multicast binary feed handler and L3/MBP order book engine in Rust."
license = "MIT OR Apache-2.0"
repository = "https://github.com/patrick-isles/hkex-omd-rs"
keywords = ["hkex", "hft", "order-book", "market-data", "low-latency"]
categories = ["finance", "network-programming", "no-std"]

[dependencies]

[dev-dependencies]
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }

[[bench]]
name = "latency"
harness = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
